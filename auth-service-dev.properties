# ================== AUTH SERVICE DEV CONFIGURATION ==================

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/citizenfix_auth_db
spring.datasource.username=root
spring.datasource.password=root

# Hibernate
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration
app.jwt.secret=dev-super-secret-key-for-local-development

# Twilio Configuration
twilio.account-sid=dev-account-sid
twilio.auth-token=dev-auth-token
twilio.phone-number=+1234567890

# Logging
logging.level.com.citizenfix=DEBUG
logging.level.com.citizenfix.auth=DEBUG
