# ================== AUTH SERVICE CONFIGURATION ==================

spring.application.name=auth-service

server.port=8100

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/citizenfix_auth_db
spring.datasource.username=root
spring.datasource.password=root

# JWT Configuration
app.jwt.secret=your-super-secret-key-change-in-production-12345678901234567890
app.jwt.expiration=86400000

# Twilio Configuration (for SMS OTP)
twilio.account-sid=${TWILIO_ACCOUNT_SID:your-account-sid}
twilio.auth-token=${TWILIO_AUTH_TOKEN:your-auth-token}
twilio.phone-number=+1234567890

# OTP Configuration
otp.expiration-minutes=10
otp.max-attempts=3

# Logging
logging.level.com.citizenfix.auth=DEBUG

# Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.citizenfix=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Server Configuration
server.servlet.context-path=/api
server.compression.enabled=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.consumer.group-id=citizenfix-group
spring.kafka.consumer.auto-offset-reset=earliest

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=30000
resilience4j.circuitbreaker.instances.default.minimum-number-of-calls=10

resilience4j.retry.instances.default.max-attempts=5
resilience4j.retry.instances.default.wait-duration=1000
resilience4j.retry.instances.default.interval-function=exponential

# Micrometer Tracing
management.tracing.sampling.probability=1.0

# Zipkin Configuration
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
