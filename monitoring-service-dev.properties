# ================== MONITORING SERVICE DEV CONFIGURATION ==================

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/citizenfix_monitoring_db
spring.datasource.username=root
spring.datasource.password=root

# Hibernate
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.com.citizenfix=DEBUG
logging.level.com.citizenfix.monitoring=DEBUG
logging.level.de.codecentric.boot.admin=INFO

# Twilio Configuration
twilio.account-sid=dev-account-sid
twilio.auth-token=dev-auth-token
twilio.phone-number=+1234567890

# Alert Recipients
alert.sms-recipients=+919876543210,+919876543211
