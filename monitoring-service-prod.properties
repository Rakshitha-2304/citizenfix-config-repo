# ================== MONITORING SERVICE PROD CONFIGURATION ==================

# Database Configuration
spring.datasource.url=jdbc:mysql://prod-db-server:3306/citizenfix_monitoring_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Logging
logging.level.com.citizenfix=INFO
logging.level.com.citizenfix.monitoring=INFO
logging.level.de.codecentric.boot.admin=WARN

# Twilio Configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER}

# Alert Recipients
alert.sms-recipients=${ALERT_SMS_RECIPIENTS}
