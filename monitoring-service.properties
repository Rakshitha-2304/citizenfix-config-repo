# ================== MONITORING SERVICE CONFIGURATION ==================

spring.application.name=monitoring-service
server.port=9000

# Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=monitoring-group

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=30000
resilience4j.circuitbreaker.instances.default.minimum-number-of-calls=10

resilience4j.retry.instances.default.max-attempts=5
resilience4j.retry.instances.default.wait-duration=1000
resilience4j.retry.instances.default.interval-function=exponential

# Micrometer Tracing
management.tracing.sampling.probability=1.0

# Zipkin Configuration
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Spring Boot Admin
spring.boot.admin.ui.enabled=true
spring.boot.admin.ui.title=CitizenFix Monitoring Dashboard

# Monitoring Configuration
monitoring.health-check-interval-seconds=10

monitoring.services-to-monitor=\
eureka-server,\
config-server,\
api-gateway,\
auth-service,\
complaint-service,\
assignment-service,\
status-service,\
escalation-service,\
insights-service

# Alert Configuration
alert.enabled=true
alert.error-rate-threshold=5
alert.response-time-threshold-ms=2000

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=5m
